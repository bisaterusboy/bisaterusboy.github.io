<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>   
    <style>
    :root {
      /* Theme Variables (Dynamic via JS) */
      --accent-hue: 260; /* Violet Default */
      --accent-primary: hsl(var(--accent-hue), 90%, 66%);
      --accent-secondary: hsl(calc(var(--accent-hue) + 40), 95%, 60%);
      --accent-glow: hsla(var(--accent-hue), 90%, 66%, 0.45);
      --accent-glow-subtle: hsla(var(--accent-hue), 90%, 66%, 0.15);

      --bg-dark: #060812;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-glow: hsla(var(--accent-hue), 80%, 65%, 0.35);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-full: 9999px;

      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    

    /* =========================================================
       PRELOADER OVERLAY
       ========================================================= */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      padding: 2rem;
      transition: opacity 0.8s var(--transition-smooth), transform 0.8s var(--transition-smooth), filter 0.8s var(--transition-smooth);
    }

    .preloader.vanish {
      opacity: 0;
      transform: scale(1.08);
      filter: blur(30px);
      pointer-events: none;
    }

    .loader-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    /* Logo with Fade-In + Scale + Glowing Pulse Effect */
    .logo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      animation: logoIntro 1.2s var(--transition-smooth) forwards;
    }

    .logo-pulse-ring {
      position: absolute;
      inset: -12px;
      border-radius: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      opacity: 0.35;
      filter: blur(22px);
      animation: pulseAura 2.5s ease-in-out infinite alternate;
    }

    .logo-glass-badge {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathScale 3s ease-in-out infinite alternate;
    }

    .logo-glass-badge svg {
      width: 54px;
      height: 54px;
      filter: drop-shadow(0 0 16px var(--accent-glow));
      transition: filter 0.5s ease;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2.2rem;
      opacity: 0.95;
    }

    /* Circular SVG Ring & Central Percentage */
    .counter-circle-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 8;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ring-gradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 440; /* 2 * PI * 70 */
      stroke-dashoffset: 440;
      transition: stroke-dashoffset 0.1s linear;
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    .counter-center-text {
      position: absolute;
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-family: var(--font-mono);
    }

    .counter-value {
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text-main);
      text-shadow: 0 0 25px var(--accent-glow);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .counter-unit {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent-primary);
      margin-left: 3px;
      text-shadow: 0 0 15px var(--accent-glow);
    }

    /* Linear Progress Bar & Shimmer */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 1.2rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: var(--radius-full);
      box-shadow: 0 0 16px var(--accent-primary);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      animation: shimmer 1.5s infinite;
    }

    .status-text {
      font-size: 0.88rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      min-height: 1.4rem;
    }

    @keyframes logoIntro {
      0% {
        opacity: 0;
        transform: scale(0.6) translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes breathScale {
      0% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1.06);
      }
    }

    @keyframes pulseAura {
      0% {
        opacity: 0.25;
        transform: scale(0.9);
      }
      100% {
        opacity: 0.65;
        transform: scale(1.18);
      }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }


    
    .panel-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }

    .header-text h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .header-text p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      color: #10b981;
      white-space: nowrap;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: statusPulse 2s infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.4rem;
      backdrop-filter: blur(16px);
      transition: all 0.3s ease;
    }

    .metric-card:hover {
      border-color: var(--border-glow);
      transform: translateY(-4px);
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .metric-val {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .control-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* Theme Chips */
    .theme-options {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .theme-chip {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .theme-chip:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .theme-chip.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-primary);
      color: var(--text-main);
      box-shadow: 0 0 18px var(--accent-glow-subtle);
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    /* Speed Selectors */
    .speed-options {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .speed-btn {
      flex: 1;
      min-width: 110px;
      padding: 0.65rem 1rem;
      text-align: center;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .speed-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Sound Switcher */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-subtle);
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .toggle-switch.active {
      background: var(--accent-primary);
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.3s var(--transition-smooth);
    }

    .toggle-switch.active .toggle-knob {
      transform: translateX(24px);
    }

    

    @media (max-width: 640px) {
      .preloader {
        padding: 1.5rem;
      }

      .logo-wrapper {
        width: 90px;
        height: 90px;
        margin-bottom: 1.5rem;
      }

      .brand-title {
        font-size: 1.25rem;
        letter-spacing: 0.25em;
        margin-bottom: 1.8rem;
      }

      .counter-circle-container {
        width: 150px;
        height: 150px;
      }

      .counter-value {
        font-size: 2.6rem;
      }

      .panel-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem;
      }

      .badge-status {
        align-self: flex-start;
      }

      .controls-card {
        padding: 1.5rem;
      }

      .speed-options {
        flex-direction: column;
      }

      .speed-btn {
        width: 100%;
      }
    }
  </style>
  <!-- Ambient Dynamic Canvas Background -->
  <canvas id="bg-canvas"></canvas>
  <div id="ambient-glow" class="ambient-glow"></div>

  <!-- 1. PRELOADER OVERLAY -->
  <div id="preloader" class="preloader">
    <div class="loader-box">
      
      <!-- SVG Logo with Scale + Fade + Pulse Aura -->
      <div class="logo-wrapper">
        <div class="logo-pulse-ring"></div>
        <div class="logo-glass-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
              <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-primary)" />
                <stop offset="100%" stop-color="var(--accent-secondary)" />
              </linearGradient>
            </defs>
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
      </div>

      <div class="brand-title">MITRACOM ENGINE</div>

      <!-- Circular SVG Ring & Counter (0 - 100%) -->
      <div class="counter-circle-container">
        <svg class="ring-svg" viewBox="0 0 160 160">
          <defs>
            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--accent-primary)" />
              <stop offset="100%" stop-color="var(--accent-secondary)" />
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
          <circle id="ring-progress" class="ring-progress" cx="80" cy="80" r="70"></circle>
        </svg>

        <div class="counter-center-text">
          <span id="counter-val" class="counter-value">0</span>
          <span class="counter-unit">%</span>
        </div>
      </div>

      <!-- Supporting Linear Progress Bar & Shimmer -->
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <!-- Dynamic Status Text -->
      <span id="status-text" class="status-text">Menginisialisasi Sistem...</span>

    </div>
  </div>

  <!-- 2. COMPLETION CONTROL PANEL (VIEW AFTER 100%) -->
  <div id="completion-panel" class="completion-panel"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // State Management
      const state = {
        progress: 0,
        duration: 3000, // Default 3 sec
        hue: 260,
        soundEnabled: true,
        isRunning: false,
        startTime: null,
        animFrameId: null
      };

      // Status messages list
      const statusMessages = [
        "Menginisialisasi Sistem...",
        "Memuat Modul Grafis...",
        "Mengalokasikan Memori...",
        "Menyiapkan Antarmuka...",
        "Pemuatan Selesai!"
      ];

      // DOM Elements
      const preloader = document.getElementById('preloader');
      const completionPanel = document.getElementById('completion-panel');
      const counterVal = document.getElementById('counter-val');
      const ringProgress = document.getElementById('ring-progress');
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status-text');

      const btnReplay = document.getElementById('btn-replay');
      const speedBtns = document.querySelectorAll('.speed-btn');
      const themeChips = document.querySelectorAll('.theme-chip');
      const toggleSound = document.getElementById('toggle-sound');

      const metricTime = document.getElementById('metric-time');
      const metricParticles = document.getElementById('metric-particles');
      const metricAudio = document.getElementById('metric-audio');

      // Circular Ring Radius Constants (r=70 => perimeter ~ 440)
      const CIRCLE_CIRCUMFERENCE = 440;

      // =========================================================
      // WEB AUDIO SYNTHESIZER (NO EXTERNAL AUDIO FILES)
      // =========================================================
      let audioCtx = null;

      const playCompletionChime = () => {
        if (!state.soundEnabled) return;
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;

          // Oscillator 1: High Sine Note
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(523.25, now); // C5
          osc1.frequency.exponentialRampToValueAtTime(1046.50, now + 0.4); // C6

          gain1.gain.setValueAtTime(0, now);
          gain1.gain.linearRampToValueAtTime(0.18, now + 0.05);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);

          // Oscillator 2: Warm Harmony Note
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(659.25, now + 0.1); // E5
          osc2.frequency.exponentialRampToValueAtTime(1318.51, now + 0.5); // E6

          gain2.gain.setValueAtTime(0, now + 0.1);
          gain2.gain.linearRampToValueAtTime(0.12, now + 0.15);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);

          osc1.start(now);
          osc1.stop(now + 0.8);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.9);
        } catch (e) {
          console.log('Audio Context error:', e);
        }
      };

      // =========================================================
      // SMOOTH LOADING ANIMATION ENGINE (0-100%)
      // =========================================================
      const updateProgressUI = (percent) => {
        const rounded = Math.min(100, Math.floor(percent));
        counterVal.innerText = rounded;

        // Circular Ring Offset Calculation
        const offset = CIRCLE_CIRCUMFERENCE - (percent / 100) * CIRCLE_CIRCUMFERENCE;
        ringProgress.style.strokeDashoffset = offset;

        // Linear Progress Bar Width
        progressFill.style.width = `${percent}%`;

        // Update Dynamic Status Text
        if (rounded < 25) {
          statusText.innerText = statusMessages[0];
        } else if (rounded < 50) {
          statusText.innerText = statusMessages[1];
        } else if (rounded < 75) {
          statusText.innerText = statusMessages[2];
        } else if (rounded < 99) {
          statusText.innerText = statusMessages[3];
        } else {
          statusText.innerText = statusMessages[4];
        }
      };

      const startLoadingPipeline = () => {
        if (state.isRunning) return;
        state.isRunning = true;
        state.progress = 0;
        state.startTime = null;

        // Reset Overlay states
        preloader.classList.remove('vanish');
        completionPanel.classList.remove('active');
        updateProgressUI(0);

        const step = (timestamp) => {
          if (!state.startTime) state.startTime = timestamp;
          const elapsed = timestamp - state.startTime;
          
          // Easing function for smooth organic loader speed
          let currentProgress = (elapsed / state.duration) * 100;

          if (currentProgress > 100) currentProgress = 100;

          updateProgressUI(currentProgress);

          if (currentProgress < 100) {
            state.animFrameId = requestAnimationFrame(step);
          } else {
            // Completion Reached!
            state.isRunning = false;
            playCompletionChime();

            setTimeout(() => {
              // 1. Fade-out + Scale preloader
              preloader.classList.add('vanish');

              // 2. Reveal Interactive Completion Panel
              setTimeout(() => {
                completionPanel.classList.add('active');
              }, 400);

            }, 300);
          }
        };

        // Delay initial frame slightly for entrance visual feel
        setTimeout(() => {
          state.animFrameId = requestAnimationFrame(step);
        }, 200);
      };

      // Initial Kickoff
      startLoadingPipeline();


      // =========================================================
      // INTERACTIVE CONTROLS LISTENERS
      // =========================================================
      
      // Replay Button
      btnReplay.addEventListener('click', () => {
        startLoadingPipeline();
      });

      // Speed Buttons Selector
      speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          speedBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const duration = parseInt(btn.getAttribute('data-duration'), 10);
          state.duration = duration;
          metricTime.innerText = (duration / 1000).toFixed(2) + 's';
        });
      });

      // Theme Colors Selector
      themeChips.forEach(chip => {
        chip.addEventListener('click', () => {
          themeChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');

          const hue = chip.getAttribute('data-hue');
          state.hue = hue;

          // Update Root CSS Variables dynamically
          document.documentElement.style.setProperty('--accent-hue', hue);
        });
      });

      // Sound Switcher Toggle
      toggleSound.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        toggleSound.classList.toggle('active', state.soundEnabled);
        metricAudio.innerText = state.soundEnabled ? 'Aktif' : 'Mute';
      });

    });
  </script>
  </body>
