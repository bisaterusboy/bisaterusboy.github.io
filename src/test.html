<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mitracom Solusi Teknologi | Loading Animation Preview</title>
<link rel="icon" type="image/svg+xml" href="/mst.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALET WARNA BRAND MITRACOM SOLUSI TEKNOLOGI (VANILLA CSS)
   https://bisaterusboy.github.io/
   ============================================================ */
:root {
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Space Grotesk', monospace;

  /* Tema Utama: Mitracom Fiber Blue (Official Brand Identity) */
  --bg-deep: #030714;
  --bg-gradient: radial-gradient(circle at 50% 40%, #0d2258 0%, #06112c 35%, #030818 70%, #01040d 100%);
  --brand-blue: #0066ff;
  --brand-cyan: #00d2ff;
  --brand-gold: #ffb703;
  --brand-red: #ff3b30;
  --accent-primary: #0066ff;
  --accent-secondary: #00e5ff;
  --accent-glow: rgba(0, 102, 255, 0.45);
  --accent-secondary-glow: rgba(0, 229, 255, 0.35);
  --card-glass: rgba(255, 255, 255, 0.05);
  --border-glass: rgba(255, 255, 255, 0.14);
  --text-main: #ffffff;
  --text-sub: rgba(255, 255, 255, 0.65);
}

/* Tema: Midnight Cyber (Deep Dark) */
[data-theme="midnight"] {
  --bg-deep: #020308;
  --bg-gradient: radial-gradient(circle at 50% 40%, #151b36 0%, #090e1f 35%, #040712 70%, #010206 100%);
  --accent-primary: #4361ee;
  --accent-secondary: #4cc9f0;
  --accent-glow: rgba(67, 97, 238, 0.45);
  --accent-secondary-glow: rgba(76, 201, 240, 0.35);
}

/* Tema: Solar Gold (Mitracom Accent Gold) */
[data-theme="gold"] {
  --bg-deep: #0f0a02;
  --bg-gradient: radial-gradient(circle at 50% 40%, #362204 0%, #211402 35%, #0f0a02 70%, #050300 100%);
  --accent-primary: #f59e0b;
  --accent-secondary: #fbbf24;
  --accent-glow: rgba(245, 158, 11, 0.45);
  --accent-secondary-glow: rgba(251, 191, 36, 0.35);
}

/* Tema: Crimson Fiber (Mitracom Accent Red) */
[data-theme="crimson"] {
  --bg-deep: #120305;
  --bg-gradient: radial-gradient(circle at 50% 40%, #3e0c12 0%, #22060a 35%, #100204 70%, #050001 100%);
  --accent-primary: #ef4444;
  --accent-secondary: #f43f5e;
  --accent-glow: rgba(239, 68, 68, 0.45);
  --accent-secondary-glow: rgba(244, 63, 94, 0.35);
}

/* Reset Dasar */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-deep);
  font-family: var(--font-main);
  color: var(--text-main);
  user-select: none;
}

/* ============================================================
   CONTAINER & DEVICE PREVIEW FRAMEWORK
   ============================================================ */
#app-viewport {
  width: 100vw;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.stage-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--bg-gradient);
}

/* Simulasi Layar HP untuk Preview Cepat di Desktop */
#app-viewport.mode-mobile-preview .stage-wrapper {
  width: 375px;
  height: 750px;
  max-height: 90vh;
  border-radius: 44px;
  border: 11px solid #1f2538;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.mobile-notch {
  display: none;
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 115px;
  height: 25px;
  background: #000;
  border-radius: 20px;
  z-index: 99;
}
#app-viewport.mode-mobile-preview .mobile-notch {
  display: block;
}

/* ============================================================
   BACKGROUND: FIBER OPTIC AURORA & NETWORK MESH
   ============================================================ */
.ambient-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  pointer-events: none;
  opacity: 0.55;
  will-change: transform, opacity;
  transition: background 0.7s ease;
}

.glow-orb-1 {
  width: 46vw;
  height: 46vw;
  min-width: 300px;
  min-height: 300px;
  left: -8%;
  top: -12%;
  background: var(--accent-glow);
  animation: orbFloat1 12s ease-in-out infinite alternate;
}

.glow-orb-2 {
  width: 44vw;
  height: 44vw;
  min-width: 280px;
  min-height: 280px;
  right: -10%;
  bottom: -12%;
  background: var(--accent-secondary-glow);
  animation: orbFloat2 14s ease-in-out infinite alternate;
}

.glow-orb-3 {
  width: 32vw;
  height: 32vw;
  min-width: 220px;
  min-height: 220px;
  left: 34%;
  top: 38%;
  background: var(--accent-glow);
  opacity: 0.28;
  animation: orbFloat3 10s ease-in-out infinite alternate;
}

/* Cyber Matrix Network Grid */
.network-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle at 50% 50%, black 18%, transparent 78%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 18%, transparent 78%);
  pointer-events: none;
}

/* Fiber Sparkle Nodes */
.network-node {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 10px #fff, 0 0 18px var(--accent-secondary);
  pointer-events: none;
  animation: nodeTwinkle 4s ease-in-out infinite;
}

.n1 { top: 20%; left: 18%; animation-delay: 0.3s; }
.n2 { top: 25%; right: 20%; animation-delay: 1.5s; }
.n3 { bottom: 22%; left: 22%; animation-delay: 2.2s; }
.n4 { bottom: 28%; right: 19%; animation-delay: 0.8s; }
.n5 { top: 14%; left: 50%; animation-delay: 2.9s; }

/* ============================================================
   KONTEN UTAMA ANIMASI LOADING (CENTERPIECE)
   ============================================================ */
.loading-centerpiece {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
  text-align: center;
}

/* HUD & LOGO WRAPPER */
.hud-wrapper {
  position: relative;
  width: clamp(230px, 44vw, 310px);
  height: clamp(230px, 44vw, 310px);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;
}

/* Orbit Ring Putar Halus */
.outer-orbit-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.16);
  animation: orbitRotate 22s linear infinite;
}

.outer-orbit-ring::after {
  content: "";
  position: absolute;
  top: 8px;
  left: 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-secondary);
  box-shadow: 0 0 12px var(--accent-secondary);
}

/* Circular HUD SVG Progress Ring */
.svg-progress-circle {
  position: absolute;
  inset: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
  transform: rotate(-90deg);
}

.circle-track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 5;
}

.circle-fill {
  fill: none;
  stroke: url(#mitracomGradient);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 691; /* 2 * PI * 110 */
  stroke-dashoffset: 691;
  transition: stroke-dashoffset 0.1s linear;
  filter: drop-shadow(0 0 10px var(--accent-glow));
}

/* ============================================================
   LOGO MITRACOM SOLUSI TEKNOLOGI: FADE + SCALE EFFECT
   ============================================================ */
.logo-container {
  position: relative;
  width: clamp(120px, 26vw, 155px);
  height: clamp(100px, 20vw, 130px);
  display: flex;
  align-items: center;
  justify-content: center;
  /* Animasi Pembuka Fade + Scale */
  animation: logoEntrance 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  will-change: transform, opacity, filter;
}

/* Glassmorphism Background Card untuk Logo */
.logo-glass {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  box-shadow: 
    0 20px 50px rgba(0, 0, 0, 0.5),
    inset 0 1px 1px rgba(255, 255, 255, 0.25);
  transform: rotate(4deg);
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Badge Wadah Logo Gambar */
.logo-badge {
  position: relative;
  width: 86%;
  height: 84%;
  border-radius: 20px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  box-shadow: 
    0 12px 35px rgba(0, 0, 0, 0.4),
    0 0 32px var(--accent-glow);
  animation: logoPulse 3s ease-in-out infinite;
  overflow: hidden;
}

/* Gambar Logo Mitracom (Logo Mitracom.png) */
.logo-img {
  width: 100%;
  height: 100%;
  max-height: 90%;
  object-fit: contain;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

/* Fallback SVG Jika Gambar Belum Termuat */
.logo-fallback {
  display: none;
  width: 48px;
  height: 48px;
  fill: #0056b3;
}

/* Checkmark Icon Sukses (Muncul saat 100%) */
.complete-check-icon {
  position: absolute;
  width: 52px;
  height: 52px;
  color: #0066ff;
  opacity: 0;
  transform: scale(0.3) rotate(-30deg);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}

/* Shockwave Ring Saat Selesai 100% */
.shockwave-ring {
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  border: 2px solid var(--accent-secondary);
  opacity: 0;
  pointer-events: none;
}

/* ============================================================
   ANGKA LOADING PERSENTASE 0 - 100% PADA TENGAH
   ============================================================ */
.percentage-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: -8px;
  animation: contentFadeUp 0.85s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.counter-row {
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
}

.percentage-number {
  font-family: var(--font-display);
  font-size: clamp(48px, 9.5vw, 76px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #ffffff 20%, rgba(255, 255, 255, 0.8) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 10px 40px var(--accent-glow);
  min-width: 2.2ch;
  text-align: right;
}

.percentage-symbol {
  font-family: var(--font-display);
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 600;
  color: var(--accent-secondary);
  margin-left: 4px;
  text-shadow: 0 0 16px var(--accent-secondary);
}

/* Branding Name & Tagline */
.brand-name {
  font-size: clamp(14px, 2.8vw, 17px);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 10px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--brand-gold);
  box-shadow: 0 0 8px var(--brand-gold);
}

.brand-slogan {
  font-size: clamp(10px, 1.8vw, 12px);
  font-weight: 500;
  letter-spacing: 0.16em;
  color: var(--text-sub);
  margin-top: 4px;
  text-transform: uppercase;
}

/* Status Pesan Dinamis (ISP Jaringan) */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  margin-top: 15px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-secondary);
  box-shadow: 0 0 8px var(--accent-secondary);
  animation: blink 1.2s infinite ease-in-out;
}

.status-text {
  font-size: clamp(11px, 2.2vw, 13px);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-sub);
  min-width: 190px;
  text-align: center;
}

/* Progress Bar Linear Bawah */
.linear-track-box {
  width: min(300px, 78vw);
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 16px;
  position: relative;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

.linear-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  border-radius: inherit;
  box-shadow: 0 0 16px var(--accent-secondary);
  transition: width 0.08s linear;
}

/* ============================================================
   STATUS STATE SELESAI (TANPA BERANDA)
   ============================================================ */
.completion-badge {
  display: none;
  opacity: 0;
  transform: translateY(12px) scale(0.95);
  margin-top: 18px;
  padding: 9px 22px;
  border-radius: 30px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: #fff;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.completion-badge span {
  color: var(--accent-secondary);
  font-weight: 700;
}

/* Kelas Saat Animasi Mencapai 100% Selesai */
.stage-wrapper.is-finished .shockwave-ring {
  animation: shockwaveBoom 0.9s ease-out forwards;
}

.stage-wrapper.is-finished .logo-glass {
  transform: rotate(0deg) scale(1.05);
  border-color: rgba(255, 255, 255, 0.35);
}

.stage-wrapper.is-finished .logo-img {
  opacity: 0;
  transform: scale(0.3);
}

.stage-wrapper.is-finished .complete-check-icon {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.stage-wrapper.is-finished .status-dot {
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
  animation: none;
}

.stage-wrapper.is-finished .completion-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* ============================================================
   TOOLBAR PREVIEW DOCK (INTERACTIVE TESTING)
   ============================================================ */
.preview-dock {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: rgba(10, 15, 32, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 50px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
  max-width: calc(100vw - 32px);
  flex-wrap: wrap;
  justify-content: center;
}

.btn-replay {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: #ffffff;
  border: none;
  font-family: var(--font-main);
  font-size: 13px;
  font-weight: 700;
  padding: 9px 18px;
  border-radius: 30px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 15px var(--accent-glow);
}

.btn-replay:hover {
  transform: translateY(-1px) scale(1.03);
  box-shadow: 0 6px 20px var(--accent-glow);
}

.btn-replay:active {
  transform: scale(0.97);
}

.btn-replay svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}

.dock-separator {
  width: 1px;
  height: 22px;
  background: rgba(255, 255, 255, 0.15);
}

.dock-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.04);
  padding: 3px;
  border-radius: 20px;
}

.dock-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0 6px;
}

.btn-chip {
  background: transparent;
  color: rgba(255, 255, 255, 0.7);
  border: none;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-main);
}

.btn-chip:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.btn-chip.active {
  color: #fff;
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.theme-palette {
  display: flex;
  align-items: center;
  gap: 6px;
}

.theme-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}

.theme-dot:hover {
  transform: scale(1.18);
}

.theme-dot.active {
  border-color: #fff;
  transform: scale(1.15);
}

.theme-dot[data-theme="fiber"] {
  background: linear-gradient(135deg, #0066ff, #00d2ff);
}
.theme-dot[data-theme="midnight"] {
  background: linear-gradient(135deg, #4361ee, #4cc9f0);
}
.theme-dot[data-theme="gold"] {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
}
.theme-dot[data-theme="crimson"] {
  background: linear-gradient(135deg, #ef4444, #f43f5e);
}

.btn-toggle-device {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  font-size: 11px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  font-family: var(--font-main);
}

.btn-toggle-device:hover {
  background: rgba(255, 255, 255, 0.15);
}

/* ============================================================
   KEYFRAME ANIMATIONS
   ============================================================ */
@keyframes logoEntrance {
  0% {
    opacity: 0;
    transform: scale(0.35) translateY(28px);
    filter: blur(14px);
  }
  60% {
    opacity: 1;
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes logoPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

@keyframes contentFadeUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes shockwaveBoom {
  0% {
    opacity: 0.95;
    transform: scale(0.7);
  }
  100% {
    opacity: 0;
    transform: scale(1.6);
  }
}

@keyframes orbitRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes orbFloat1 {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(6vw, 4vh, 0) scale(1.15); }
}
@keyframes orbFloat2 {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(-6vw, -5vh, 0) scale(1.12); }
}
@keyframes orbFloat3 {
  0% { transform: translate3d(0, 0, 0) scale(0.9); }
  100% { transform: translate3d(3vw, -3vh, 0) scale(1.1); }
}

@keyframes nodeTwinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 0.95; transform: scale(1.4); }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Responsive Breakpoints */
@media (max-width: 768px) {
  .preview-dock {
    bottom: 16px;
    padding: 7px 10px;
    gap: 8px;
  }
  .btn-toggle-device {
    display: none;
  }
}

@media (max-width: 480px) {
  .preview-dock {
    width: calc(100% - 24px);
    border-radius: 20px;
    justify-content: space-around;
  }
  .dock-label, .dock-separator {
    display: none;
  }
  .hud-wrapper {
    margin-bottom: 14px;
  }
  .status-pill {
    margin-top: 10px;
    padding: 5px 12px;
  }
  .linear-track-box {
    margin-top: 14px;
  }
}
</style>
</head>
<body>

<!-- SVG Gradient Definitions -->
<svg width="0" height="0" style="position: absolute;">
  <defs>
    <linearGradient id="mitracomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-primary)" />
      <stop offset="100%" stop-color="var(--accent-secondary)" />
    </linearGradient>
  </defs>
</svg>

<div id="app-viewport">
  <div class="stage-wrapper" id="stage">
    
    <!-- Notch Display saat Mode HP Preview -->
    <div class="mobile-notch"></div>

    <!-- Estetika Background: Fiber Aurora & Network Mesh -->
    <div class="ambient-glow glow-orb-1"></div>
    <div class="ambient-glow glow-orb-2"></div>
    <div class="ambient-glow glow-orb-3"></div>
    <div class="network-grid"></div>

    <!-- Fiber Optical Sparkle Nodes -->
    <div class="network-node n1"></div>
    <div class="network-node n2"></div>
    <div class="network-node n3"></div>
    <div class="network-node n4"></div>
    <div class="network-node n5"></div>

    <!-- Centerpiece Loading -->
    <main class="loading-centerpiece">
      
      <!-- HUD & Logo Mitracom -->
      <div class="hud-wrapper">
        <div class="outer-orbit-ring"></div>
        <div class="shockwave-ring"></div>

        <!-- SVG Circular HUD Tracker -->
        <svg class="svg-progress-circle" viewBox="0 0 240 240">
          <circle class="circle-track" cx="120" cy="120" r="110" />
          <circle class="circle-fill" id="circular-fill" cx="120" cy="120" r="110" />
        </svg>

        <!-- Logo Container dengan Efek Fade + Scale -->
        <div class="logo-container" id="logo-box">
          <div class="logo-glass"></div>
          <div class="logo-badge">
            <!-- Logo Asli Mitracom Solusi Teknologi -->
            <img 
              src="./assets/Logo Mitracom.png" 
              alt="Logo Mitracom Solusi Teknologi" 
              class="logo-img"
              id="main-logo-img"
              onerror="this.style.display='none'; document.getElementById('logo-fallback-icon').style.display='block';"
            />

            <!-- Fallback SVG jika dibuka di environment berbeda -->
            <svg class="logo-fallback" id="logo-fallback-icon" viewBox="0 0 24 24">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#0066ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            
            <!-- Checkmark Icon Sukses (Muncul saat 100%) -->
            <svg class="complete-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <!-- Angka Persentase 0 - 100% pada Tengah -->
      <div class="percentage-wrapper">
        <div class="counter-row">
          <span class="percentage-number" id="percentage-num">0</span>
          <span class="percentage-symbol">%</span>
        </div>

        <!-- Identitas Brand Mitracom (https://bisaterusboy.github.io/) -->
        <div class="brand-name">
          <span>MITRACOM SOLUSI TEKNOLOGI</span>
          <span class="brand-dot"></span>
        </div>
        <div class="brand-slogan">The Best Partner Your Internet Connection</div>

        <!-- Status Pesan Dinamis (Jaringan ISP) -->
        <div class="status-pill">
          <div class="status-dot"></div>
          <span class="status-text" id="status-text">Menginisialisasi Jaringan</span>
        </div>

        <!-- Bar Progress Linear -->
        <div class="linear-track-box">
          <div class="linear-bar" id="linear-bar"></div>
        </div>

        <!-- Status Badge Saat Selesai (Tanpa Beranda) -->
        <div class="completion-badge" id="completion-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-secondary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>Koneksi Siap</span> • Nikmati Internet Cepat & Stabil
        </div>
      </div>

    </main>

  </div>
</div>

<!-- ============================================================
     TOOLBAR KONTROL PREVIEW (FITUR TESTING LANGSUNG)
     ============================================================ -->
<aside class="preview-dock" aria-label="Kontrol Preview Animasi">
  <!-- Tombol Replay -->
  <button class="btn-replay" id="btn-replay" title="Putar ulang animasi (atau tekan Spasi)">
    <svg viewBox="0 0 24 24">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 2.97-2.17 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93 0-4.42-3.58-8-8-8zm-6 8c0-1.65.67-3.15 1.76-4.24L6.34 7.34C4.9 8.79 4 10.79 4 13c0 4.08 3.05 7.44 7 7.93v-2.02c-2.83-.48-5-2.94-5-5.91z"/>
    </svg>
    Replay
  </button>

  <div class="dock-separator"></div>

  <!-- Pilihan Durasi / Kecepatan -->
  <div class="dock-group">
    <span class="dock-label">Durasi:</span>
    <button class="btn-chip" data-speed="1600">Cepat</button>
    <button class="btn-chip active" data-speed="3200">Normal</button>
    <button class="btn-chip" data-speed="5500">Sinematik</button>
  </div>

  <div class="dock-separator"></div>

  <!-- Pilihan Tema Mitracom -->
  <div class="dock-group">
    <span class="dock-label">Tema:</span>
    <div class="theme-palette">
      <button class="theme-dot active" data-theme="fiber" title="Mitracom Fiber Blue"></button>
      <button class="theme-dot" data-theme="midnight" title="Midnight Cyber"></button>
      <button class="theme-dot" data-theme="gold" title="Solar Gold"></button>
      <button class="theme-dot" data-theme="crimson" title="Crimson Fiber"></button>
    </div>
  </div>

  <div class="dock-separator"></div>

  <!-- Tombol Simulasi Mode HP -->
  <button class="btn-toggle-device" id="btn-toggle-device" title="Pratinjau tampilan di layar HP">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <span id="device-btn-text">Mode HP</span>
  </button>
</aside>

<!-- ============================================================
     JAVASCRIPT LOGIC
     ============================================================ */
-->
<script>
(function() {
  const stage = document.getElementById('stage');
  const appViewport = document.getElementById('app-viewport');
  const logoBox = document.getElementById('logo-box');
  const percentageNum = document.getElementById('percentage-num');
  const linearBar = document.getElementById('linear-bar');
  const circularFill = document.getElementById('circular-fill');
  const statusText = document.getElementById('status-text');
  const btnReplay = document.getElementById('btn-replay');
  const btnToggleDevice = document.getElementById('btn-toggle-device');
  const deviceBtnText = document.getElementById('device-btn-text');
  const speedButtons = document.querySelectorAll('[data-speed]');
  const themeDots = document.querySelectorAll('.theme-dot');

  // SVG Circumference: 2 * PI * 110 ≈ 691.15
  const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 110;

  // Status Tahapan Jaringan ISP Mitracom
  const MITRACOM_STATUSES = [
    { threshold: 0,  text: "Menginisialisasi Jaringan" },
    { threshold: 18, text: "Menghubungkan Fiber Optic" },
    { threshold: 40, text: "Sinkronisasi Gateway & Server" },
    { threshold: 65, text: "Memeriksa Latensi & Bandwidth" },
    { threshold: 85, text: "Optimasi Kestabilan Koneksi" },
    { threshold: 95, text: "Koneksi Hampir Siap" },
    { threshold: 100, text: "Koneksi Terhubung" }
  ];

  let currentDuration = 3200;
  let animationFrameId = null;
  let startTime = null;

  function getStatusMessage(val) {
    let msg = MITRACOM_STATUSES[0].text;
    for (let i = 0; i < MITRACOM_STATUSES.length; i++) {
      if (val >= MITRACOM_STATUSES[i].threshold) {
        msg = MITRACOM_STATUSES[i].text;
      }
    }
    return msg;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / currentDuration, 1);
    const easedProgress = easeOutCubic(progress);
    const currentPercent = Math.round(easedProgress * 100);

    // Update Counter 0 - 100%
    percentageNum.textContent = currentPercent;

    // Update Linear Bar
    linearBar.style.width = currentPercent + "%";

    // Update Circular HUD
    const offset = CIRCLE_CIRCUMFERENCE - (easedProgress * CIRCLE_CIRCUMFERENCE);
    circularFill.style.strokeDashoffset = offset;

    // Update Status Teks ISP
    statusText.textContent = getStatusMessage(currentPercent);

    if (progress < 1) {
      animationFrameId = requestAnimationFrame(step);
    } else {
      onLoadingComplete();
    }
  }

  function onLoadingComplete() {
    stage.classList.add('is-finished');
    statusText.textContent = "Koneksi Terhubung";
  }

  function startLoadingAnimation() {
    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
    }

    stage.classList.remove('is-finished');

    // Trigger Re-animation Fade + Scale Logo
    logoBox.style.animation = 'none';
    void logoBox.offsetWidth;
    logoBox.style.animation = 'logoEntrance 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards';

    // Reset Elements
    percentageNum.textContent = "0";
    linearBar.style.width = "0%";
    circularFill.style.strokeDashoffset = CIRCLE_CIRCUMFERENCE;
    statusText.textContent = MITRACOM_STATUSES[0].text;

    startTime = null;
    animationFrameId = requestAnimationFrame(step);
  }

  btnReplay.addEventListener('click', startLoadingAnimation);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
      e.preventDefault();
      startLoadingAnimation();
    }
  });

  speedButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      speedButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDuration = parseInt(btn.dataset.speed, 10);
      startLoadingAnimation();
    });
  });

  themeDots.forEach(dot => {
    dot.addEventListener('click', () => {
      themeDots.forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
      const theme = dot.dataset.theme;
      if (theme === 'fiber') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
    });
  });

  btnToggleDevice.addEventListener('click', () => {
    const isMobileMode = appViewport.classList.toggle('mode-mobile-preview');
    if (isMobileMode) {
      deviceBtnText.textContent = "Layar Penuh";
      btnToggleDevice.style.background = 'rgba(255, 255, 255, 0.25)';
    } else {
      deviceBtnText.textContent = "Mode HP";
      btnToggleDevice.style.background = '';
    }
  });

  startLoadingAnimation();
})();
</script>

</body>
</html>
